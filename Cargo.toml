[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
bytes = "1.12.1"
h3 = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2", version = "0.0.8", features = ["tracing"] }
h3-quinn = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2", version = "0.0.10", features = ["datagram", "tracing"] }
h3-util = { git = "https://github.com/youyuanwu/tonic-h3.git", rev = "efaf0647bb3cedb883f8b9e7dbc15f53984c97e2", version = "0.0.6", default-features = false, features = ["quinn", "tracing"] }
h3-webtransport = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2", version = "0.1.2" }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
quinn = "0.11.11"
rcgen = "0.14.10"
rustls = "0.23.43"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
tower = { version = "0.5.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
h3-quinn = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
